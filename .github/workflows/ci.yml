name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # semgrep pins mcp==1.29.0, which conflicts with litellm[proxy]; keep it in its own environment.
      - run: pipx install semgrep==1.186.0
      - run: python tools/gen_configs.py --check
      - run: ruff check .
      - run: bandit -q -ll -r sample_app guardrails_core gateway tools
      - run: semgrep --config p/python --error --quiet sample_app guardrails_core gateway tools
      - run: python -m pytest -q
      - run: python tests/security/run_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence
          path: evidence/scenario_results.*
